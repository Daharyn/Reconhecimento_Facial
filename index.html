<!DOCTYPE html>
<html lang="pt-BR"

> <head>
  <meta charset="UTF-8"

>   <title>Reconhecimento Facial - Documentos de Segurança</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
    .camera-wrapper { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px auto; }
    #webcam-container { width: 220px; height: 220px; border: 4px solid #333; border-radius: 10px; overflow: hidden; background: #000; }
    .indicator-box { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 140px; }
    .indicator { width: 30px; height: 30px; border-radius: 50%; background-color: #ccc; transition: background-color 0.3s, box-shadow 0.3s; }
    .indicator.yellow { background-color: #ffc107; box-shadow: 0 0 12px #ffc107; }
    .indicator.green  { background-color: #28a745; box-shadow: 0 0 12px #28a745; }
    .indicator.red    { background-color: #dc3545; box-shadow: 0 0 12px #dc3545; }
    #led-label { font-size: 0.85em; font-weight: bold; color: #555; text-align: center; }
    #status { font-size: 1.2em; font-weight: bold; color: #333; margin-top: 15px; min-height: 60px; }
    .btn-group { margin-top: 15px; display: flex; justify-content: center; gap: 15px; }
    .btn { padding: 10px 20px; font-size: 1em; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-confirm { background-color: #28a745; color: white; }
    .btn-repeat  { background-color: #6c757d; color: white; }
  </style>
</head>
<body>

  <h1>Acesso a Documentos de Segurança (NRs)</h1>
  <p>Aproxime o rosto da câmera para validar seu acesso.</p>

  <div class="camera-wrapper"

>     <div id="webcam-container"></div>
    <div class="indicator-box"

>       <div id="led-indicator" class="indicator yellow"></div>
      <div id="led-label">Realizando leitura</div>
    </div>
  </div>

  <div id="status">Inicializando câmera...</div>

  <script type="text/javascript"

> 
    const URL_MODELO = "https://daharyn.github.io/Reconhecimento_Facial/";
    const URL_JSON   = "https://daharyn.github.io/Reconhecimento_Facial/colaboradores_public.json";

    const CONFIRMACAO_MINIMA   = 0.90;
    const TEMPO_CONFIRMACAO_MS = 2000;

    let model, webcam, emPausa = false;
    let colaboradorDetectado = null;
    let tempoInicioLeitura   = null;
    let colaboradorPendente  = null;
    let linksOneDrive        = {};

    async function carregarColaboradores() {
      try {
        const resposta = await fetch(URL_JSON);
        if (!resposta.ok) { console.error("Erro ao carregar JSON:", resposta.status); return; }
        const lista = await resposta.json();
        lista.forEach(c => {
          linksOneDrive[c.nome_modelo] = { nome: c.nome_exibicao, link: c.link_onedrive };
        });
        console.log("Colaboradores carregados:", Object.keys(linksOneDrive));
      } catch (erro) {
        console.error("Erro ao carregar colaboradores:", erro);
      }
    }

    async function init() {
      await carregarColaboradores();
      model  = await tmImage.load(URL_MODELO + "model.json", URL_MODELO + "metadata.json");
      webcam = new tmImage.Webcam(220, 220, true);
      await webcam.setup();
      await webcam.play();
      window.requestAnimationFrame(loop);
      document.getElementById("webcam-container").appendChild(webcam.canvas);
      atualizarSinalizador("yellow", "Realizando leitura");
      document.getElementById("status").innerText = "Aguardando reconhecimento...";
    }

    async function loop() {
      webcam.update();
      if (!emPausa) await predict();
      window.requestAnimationFrame(loop);
    }

    function atualizarSinalizador(cor, legenda) {
      document.getElementById("led-indicator").className = "indicator " + cor;
      document.getElementById("led-label").innerText = legenda;
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      let maiorProbabilidade = 0;
      let classeMaisProvavel = "";

      for (let i = 0; i < prediction.length; i++) {
        if (prediction[i].probability > maiorProbabilidade) {
          maiorProbabilidade = prediction[i].probability;
          classeMaisProvavel = prediction[i].className;
        }
      }

      if (maiorProbabilidade >= CONFIRMACAO_MINIMA) {
        if (linksOneDrive[classeMaisProvavel]) {
          const agora = Date.now();
          if (colaboradorDetectado !== classeMaisProvavel) {
            colaboradorDetectado = classeMaisProvavel;
            tempoInicioLeitura   = agora;
          }
          const tempoDecorrido = agora - tempoInicioLeitura;
          const tempoRestante  = ((TEMPO_CONFIRMACAO_MS - tempoDecorrido) / 1000).toFixed(1);

          if (tempoDecorrido >= TEMPO_CONFIRMACAO_MS) {
            emPausa             = true;
            colaboradorPendente = classeMaisProvavel;
            colaboradorDetectado = null;
            tempoInicioLeitura   = null;
            const nomeExibicao   = linksOneDrive[classeMaisProvavel].nome;
            atualizarSinalizador("yellow", "Aguardando confirmação");
            document.getElementById("status").innerHTML =
              `Pessoa escaneada: <strong>${nomeExibicao}</strong><br>` +
              `<div class="btn-group">` +
                `<button class="btn btn-repeat"  onclick="reiniciarLeitura()">Repetir</button>` +
                `<button class="btn btn-confirm" onclick="confirmarAcesso()">Confirmar</button>` +
              `</div>`;
          } else {
            const nomeExibicao = linksOneDrive[classeMaisProvavel].nome;
            atualizarSinalizador("yellow", "Realizando leitura");
            document.getElementById("status").innerHTML =
              `Identificando <strong>${nomeExibicao}</strong>...<br>` +
              `Mantenha a posição por mais <strong>${tempoRestante}s</strong>.`;
          }
        } else {
          colaboradorDetectado = null;
          tempoInicioLeitura   = null;
          atualizarSinalizador("red", "Colaborador não registrado");
          document.getElementById("status").innerText = "Colaborador não registrado no sistema.";
        }
      } else {
        colaboradorDetectado = null;
        tempoInicioLeitura   = null;
        atualizarSinalizador("yellow", "Realizando leitura");
        document.getElementById("status").innerText = "Aguardando reconhecimento...";
      }
    }

    function confirmarAcesso() {
      const link = linksOneDrive[colaboradorPendente].link;
      atualizarSinalizador("green", "Colaborador validado");
      document.getElementById("status").innerHTML =
        `<strong style="color: #28a745;">Colaborador validado! Redirecionando...</strong>`;
      setTimeout(() => {
        const novaAba = window.open(link, "_blank");
        if (!novaAba || novaAba.closed || typeof novaAba.closed === 'undefined') {
          window.location.href = link;
        } else {
          reiniciarLeitura();
        }
      }, 1000);
    }

    function reiniciarLeitura() {
      emPausa              = false;
      colaboradorPendente  = null;
      colaboradorDetectado = null;
      tempoInicioLeitura   = null;
      atualizarSinalizador("yellow", "Realizando leitura");
      document.getElementById("status").innerText = "Aguardando próximo reconhecimento...";
    }

    init();
  </script>
</body>
</html>
